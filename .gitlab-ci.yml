# `workflow` décide si GitLab doit créer un pipeline pour l'événement reçu.
# Cette sélection globale est évaluée avant les règles propres à chaque job.
workflow:
  rules:
    # Une MR exécute les contrôles statiques et le plan du réseau partagé ; le
    # plan d'un environnement reste réservé aux pipelines Web après merge.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Autorise les pipelines périodiques créés dans l'interface GitLab.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Les pipelines Web pilotent un seul environnement selon leur branche.
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "dev"'
      variables:
        DEPLOYMENT_ENVIRONMENT: staging
        TF_STATE_NAME: microcrm-staging
        INFRASTRUCTURE_ENVIRONMENT: aws-poc-staging
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        DEPLOYMENT_ENVIRONMENT: production
        TF_STATE_NAME: microcrm-production
        INFRASTRUCTURE_ENVIRONMENT: aws-poc-production
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Autorise les pipelines de release déclenchés par un tag Git.
    - if: '$CI_COMMIT_TAG'
    # Exécute le pipeline sur la branche principale avec le périmètre production.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        DEPLOYMENT_ENVIRONMENT: production
        TF_STATE_NAME: microcrm-production
        INFRASTRUCTURE_ENVIRONMENT: aws-poc-production
    # `dev` reste la branche d'intégration et pilote uniquement staging.
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables:
        DEPLOYMENT_ENVIRONMENT: staging
        TF_STATE_NAME: microcrm-staging
        INFRASTRUCTURE_ENVIRONMENT: aws-poc-staging
    # Aucun pipeline n'est créé pour les autres branches ou événements.
    - when: never

# Les stages fixent l'ordre général. Tous les jobs d'un stage peuvent s'exécuter
# en parallèle dès que leurs dépendances (`needs`) sont disponibles.
stages:
  - test
  - quality
  - build
  - release
  - terraform-network
  - terraform-plan
  - terraform
  - ansible
  - helm
  - verify

variables:
  # Interrupteur affiché dans le formulaire "Run pipeline". La valeur par
  # défaut reste sûre ; `true` ne doit être choisi que pour une session AWS
  # autorisée et détruite après collecte des preuves.
  CLOUDWATCH_AGENT_ENABLED:
    value: "false"
    options:
      - "false"
      - "true"
    description: >-
      Active CloudWatch pour cette pipeline uniquement : crée les groupes de
      logs Terraform et installe l'agent par Ansible.
  ALERT_EMAIL:
    value: ""
    description: >-
      Adresse e-mail abonnée via SNS aux passages en ALARM des trois alarmes
      CloudWatch. Laisser vide pour désactiver les notifications.
  TF_DESTROY_CONFIRM:
    value: "false"
    options:
      - "false"
      - "true"
    description: >-
      Autorise le job manuel de destruction Terraform uniquement si la valeur
      est true ; le job reste manuel et doit être lancé séparément.
  # Chaque image porte le SHA complet du commit : le tag technique permet de
  # retrouver sans ambiguïté le code qui a servi à sa construction.
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
  # PostgreSQL reste une dépendance runtime externe. La même version est
  # utilisée par le smoke test et par Kubernetes.
  POSTGRES_IMAGE: "postgres:17.10-alpine3.23"

# Le fichier racine reste court : les jobs sont répartis par responsabilité.
# `local` signifie que GitLab lit ces fichiers dans le même dépôt et au même commit.
include:
  - local: .gitlab/ci/common.yml
  - local: .gitlab/ci/dora.yml
