plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

// Corrige les CVE critiques de Tomcat 10.1.55 tout en conservant la gestion
// cohérente de la famille Tomcat par le BOM Spring Boot.
ext['tomcat.version'] = '10.1.59'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.liquibase:liquibase-core'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
}

// Copie les dependances deja resolues par Gradle dans des dossiers transmis
// au scanner SonarQube. Le scanner peut ainsi resoudre les types utilises par
// le code principal et les tests sans dependre du cache interne de Gradle.
tasks.register('sonarMainLibraries', Sync) {
	from configurations.compileClasspath
	into layout.buildDirectory.dir('sonar-libraries/main')
}

tasks.register('sonarTestLibraries', Sync) {
	// Les dependances principales sont deja presentes dans le dossier main.
	from(configurations.testCompileClasspath - configurations.compileClasspath)
	into layout.buildDirectory.dir('sonar-libraries/test')
}

tasks.register('prepareSonarAnalysis') {
	dependsOn classes, testClasses, sonarMainLibraries, sonarTestLibraries
}
