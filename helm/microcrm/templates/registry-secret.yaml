{{- if .Values.registrySecret.enabled }}
{{- $server := required "registrySecret.server est obligatoire lorsque registrySecret.enabled=true" .Values.registrySecret.server -}}
{{- $usernameBase64 := required "registrySecret.usernameBase64 est obligatoire lorsque registrySecret.enabled=true" .Values.registrySecret.usernameBase64 -}}
{{- $passwordBase64 := required "registrySecret.passwordBase64 est obligatoire lorsque registrySecret.enabled=true" .Values.registrySecret.passwordBase64 -}}
{{- $username := $usernameBase64 | b64dec -}}
{{- $password := $passwordBase64 | b64dec -}}
{{- $auth := printf "%s:%s" $username $password | b64enc -}}
{{- $credentials := dict "username" $username "password" $password "auth" $auth -}}
{{- $dockerConfig := dict "auths" (dict $server $credentials) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registrySecret.name }}
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerConfig | toJson | b64enc | quote }}
{{- end }}
