# Construit les fichiers statiques Angular après la réussite des tests frontend.
build:frontend:
  # Hérite de l'image Node, du cache npm et de l'installation des dépendances.
  extends: .frontend-node
  stage: build
  needs:
    # Les contrôles bloquants précèdent toute compilation afin d'échouer tôt.
    - job: quality:shellcheck
      artifacts: false
    - job: quality:trivy:repository
      artifacts: false
    - job: quality:trivy:kubernetes
      artifacts: false
    - job: quality:trivy:iac
      artifacts: false
    # Ces contrôles n'existent que dans certains parcours ; ils restent requis
    # lorsqu'ils sont créés par leurs règles.
    - job: quality:sonarqube
      artifacts: false
      optional: true
    - job: quality:terraform:plan
      artifacts: false
      optional: true
  script:
    - bash scripts/ci/build.sh --component frontend
  artifacts:
    # Ces fichiers servent seulement aux jobs suivants, pas à un archivage durable.
    expire_in: 1 day
    paths:
      - front/dist/microcrm/browser/
  rules:
    # Un tag promeut les images SHA déjà publiées par sa branche source.
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: never
    - when: on_success

# Produit le JAR Spring Boot utilisé ensuite pour fabriquer l'image backend.
build:backend:
  extends: .backend-java
  stage: build
  needs:
    - job: quality:shellcheck
      artifacts: false
    - job: quality:trivy:repository
      artifacts: false
    - job: quality:trivy:kubernetes
      artifacts: false
    - job: quality:trivy:iac
      artifacts: false
    - job: quality:sonarqube
      artifacts: false
      optional: true
    - job: quality:terraform:plan
      artifacts: false
      optional: true
  script:
    - bash scripts/ci/build.sh --component backend
  artifacts:
    expire_in: 1 day
    paths:
      - back/build/libs/microcrm-0.0.1-SNAPSHOT.jar
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: never
    - when: on_success

# Transforme l'artifact Angular en image Caddy sans recompiler le frontend.
build:image:frontend:
  extends: .docker-job
  stage: build
  needs:
    - job: build:frontend
      # Télécharge automatiquement `front/dist/...` depuis le job précédent.
      artifacts: true
  script:
    # `--pull` vérifie l'image de base ; le Dockerfile spécialisé contient
    # uniquement le runtime frontend déjà compilé.
    - docker build --pull --file misc/docker/frontend.Dockerfile --tag "$FRONTEND_IMAGE" .
    - mkdir -p .ci/images
    # Sauvegarde l'image en archive pour la transmettre sans registre entre stages.
    - docker save --output .ci/images/frontend.tar "$FRONTEND_IMAGE"
  artifacts:
    expire_in: 1 day
    paths:
      - .ci/images/frontend.tar
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: never
    - when: on_success

# Même chaîne pour le JAR backend et son image Java d'exécution.
build:image:backend:
  extends: .docker-job
  stage: build
  needs:
    - job: build:backend
      artifacts: true
  script:
    - docker build --pull --file misc/docker/backend.Dockerfile --tag "$BACKEND_IMAGE" .
    - mkdir -p .ci/images
    - docker save --output .ci/images/backend.tar "$BACKEND_IMAGE"
  artifacts:
    expire_in: 1 day
    paths:
      - .ci/images/backend.tar
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: never
    - when: on_success
