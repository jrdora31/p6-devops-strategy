# Vérifie les sources Terraform sans contacter AWS et sans créer de ressource.
test:terraform:
  image:
    name: hashicorp/terraform:1.15.8
    entrypoint: [""]
  stage: test
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.cache/terraform/providers"
  cache:
    key:
      files:
        - infrastructure/terraform/.terraform.lock.hcl
      prefix: terraform
    paths:
      - .cache/terraform/providers/
  before_script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
  script:
    - terraform -chdir=infrastructure/terraform fmt -check -recursive
    - terraform -chdir=infrastructure/terraform/network init -backend=false
    - terraform -chdir=infrastructure/terraform/network validate
    - terraform -chdir=infrastructure/terraform init -backend=false
    - terraform -chdir=infrastructure/terraform validate

# Produit un plan réel avec des credentials AWS temporaires obtenus par OIDC.
# Le job ne possède aucun droit d'écriture et ne lance jamais terraform apply.
.terraform:aws-oidc:
  image:
    name: hashicorp/terraform:1.15.8
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.cache/terraform/providers"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_USERNAME: "gitlab-ci-token"
    TF_HTTP_PASSWORD: "$CI_JOB_TOKEN"
    AWS_WEB_IDENTITY_TOKEN_FILE: "$CI_PROJECT_DIR/.aws/gitlab-oidc-token"
  cache:
    key:
      files:
        - infrastructure/terraform/.terraform.lock.hcl
      prefix: terraform
    paths:
      - .cache/terraform/providers/
  before_script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR" "$CI_PROJECT_DIR/.aws" "$CI_PROJECT_DIR/.ci/reports/terraform"
    - >-
      case "$TF_STATE_NAME" in
        ""|*[!a-z0-9-]*) echo "TF_STATE_NAME doit contenir uniquement des minuscules, chiffres ou tirets"; exit 1 ;;
      esac
    - export TF_HTTP_ADDRESS="$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/$TF_STATE_NAME"
    - export TF_HTTP_LOCK_ADDRESS="$TF_HTTP_ADDRESS/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="$TF_HTTP_ADDRESS/lock"
    - export TF_VAR_environment="${DEPLOYMENT_ENVIRONMENT:-staging}"
    - export TF_VAR_network_state_address="$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/microcrm-network"
    - printf '%s' "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - chmod 600 "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - CLOUDWATCH_AGENT_ENABLED="${CLOUDWATCH_AGENT_ENABLED:-false}"
    - >-
      case "$CLOUDWATCH_AGENT_ENABLED" in
        true|false) ;;
        *) echo "CLOUDWATCH_AGENT_ENABLED doit valoir true ou false"; exit 1 ;;
      esac
    - export TF_VAR_cloudwatch_agent_enabled="$CLOUDWATCH_AGENT_ENABLED"
    - export TF_VAR_alert_email="${ALERT_EMAIL:-}"

# Produit le plan du réseau partagé dans son state dédié. Ce state n'est jamais
# détruit par la pipeline afin de protéger les deux environnements.
quality:terraform:network:plan:
  extends: .terraform:aws-oidc
  stage: quality
  needs:
    - test:terraform
  variables:
    AWS_ROLE_ARN: "$AWS_PLAN_ROLE_ARN"
    TF_STATE_NAME: microcrm-network
  script:
    - >-
      NETWORK_REF="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_COMMIT_BRANCH:-}}";
      case "$NETWORK_REF:$TF_STATE_NAME" in
        "dev:microcrm-network"|"$CI_DEFAULT_BRANCH:microcrm-network") ;;
        *) echo "Périmètre du plan réseau incohérent avec la branche" >&2; exit 1 ;;
      esac
    - terraform -chdir=infrastructure/terraform/network init -reconfigure
    - terraform -chdir=infrastructure/terraform/network plan -no-color -out="$CI_PROJECT_DIR/.terraform-network-plan"
    - terraform -chdir=infrastructure/terraform/network show -no-color "$CI_PROJECT_DIR/.terraform-network-plan" > "$CI_PROJECT_DIR/.ci/reports/terraform/network-plan.txt"
    - printf 'TF_NETWORK_PLANNED_STATE_NAME=%s\n' "$TF_STATE_NAME" > "$CI_PROJECT_DIR/.ci/reports/terraform/network-state.env"
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - .terraform-network-plan
      - .ci/reports/terraform/network-plan.txt
    reports:
      dotenv: .ci/reports/terraform/network-state.env
  rules:
    - if: '$AWS_PLAN_ROLE_ARN == null || $AWS_PLAN_ROLE_ARN == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH)'
      changes:
        - infrastructure/terraform/network/**/*
        - .gitlab/ci/iac.yml
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - infrastructure/terraform/network/**/*
        - .gitlab/ci/iac.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - infrastructure/terraform/network/**/*
        - .gitlab/ci/iac.yml
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "dev"'

# Produit un plan réel de l'environnement strictement associé à la branche.
quality:terraform:plan:
  extends: .terraform:aws-oidc
  stage: terraform-plan
  needs:
    - test:terraform
    # Présent et bloquant sur une pipeline Web `dev`. Il est absent sur `main`,
    # où la production réutilise le réseau partagé déjà géré depuis `dev`.
    - job: deploy:terraform:network:apply
      artifacts: false
      optional: true
  variables:
    AWS_ROLE_ARN: "$AWS_PLAN_ROLE_ARN"
  script:
    - >-
      DEPLOYMENT_REF="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_COMMIT_BRANCH:-}}";
      case "$DEPLOYMENT_REF:$DEPLOYMENT_ENVIRONMENT:$TF_STATE_NAME:$INFRASTRUCTURE_ENVIRONMENT" in
        "dev:staging:microcrm-staging:aws-poc-staging") ;;
        "$CI_DEFAULT_BRANCH:production:microcrm-production:aws-poc-production") ;;
        *) echo "Périmètre Terraform incohérent avec la branche" >&2; exit 1 ;;
      esac
    - terraform -chdir=infrastructure/terraform init -reconfigure
    - terraform -chdir=infrastructure/terraform plan -no-color -out="$CI_PROJECT_DIR/.terraform-plan"
    - terraform -chdir=infrastructure/terraform show -no-color "$CI_PROJECT_DIR/.terraform-plan" > "$CI_PROJECT_DIR/.ci/reports/terraform/plan.txt"
    - printf 'TF_PLANNED_STATE_NAME=%s\n' "$TF_STATE_NAME" > "$CI_PROJECT_DIR/.ci/reports/terraform/state.env"
  artifacts:
    when: always
    # Le plan binaire est conservé brièvement : il peut contenir des valeurs
    # sensibles, mais garantit que le job apply exécute exactement ce plan.
    expire_in: 1 day
    paths:
      - .terraform-plan
      - .ci/reports/terraform/plan.txt
    reports:
      dotenv: .ci/reports/terraform/state.env
  rules:
    - if: '$AWS_PLAN_ROLE_ARN == null || $AWS_PLAN_ROLE_ARN == ""'
      when: never
    # Aucun plan environnement en MR : il dépend du state microcrm-network.
    - if: '$CI_PIPELINE_SOURCE == "web" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'

# L'initialisation du réseau partagé est manuelle, limitée à une pipeline Web
# `dev` et ne possède volontairement aucun job destroy.
deploy:terraform:network:apply:
  extends: .terraform:aws-oidc
  stage: terraform-network
  needs:
    - job: quality:terraform:network:plan
      artifacts: true
    - job: quality:trivy:iac
  variables:
    AWS_ROLE_ARN: "$AWS_APPLY_ROLE_ARN"
    TF_STATE_NAME: microcrm-network
  resource_group: aws-poc-network
  environment:
    name: aws-poc-network
  manual_confirmation: "Confirmer la création ou la mise à jour du réseau AWS partagé"
  script:
    - 'test "$CI_PIPELINE_SOURCE" = "web"'
    - 'test "$CI_COMMIT_BRANCH" = "dev"'
    - 'test "$TF_STATE_NAME" = "microcrm-network"'
    - 'test "$TF_STATE_NAME" = "$TF_NETWORK_PLANNED_STATE_NAME"'
    - test -f "$CI_PROJECT_DIR/.terraform-network-plan"
    - terraform -chdir=infrastructure/terraform/network init -reconfigure
    - terraform -chdir=infrastructure/terraform/network apply -auto-approve "$CI_PROJECT_DIR/.terraform-network-plan"
  rules:
    - if: '$AWS_APPLY_ROLE_ARN == null || $AWS_APPLY_ROLE_ARN == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "dev"'
      when: manual

# Applique exclusivement le plan binaire de l'environnement associé à la
# branche. Le rôle AWS d'écriture est distinct du rôle de lecture du plan.
deploy:terraform:apply:
  extends: .terraform:aws-oidc
  stage: terraform
  needs:
  - job: quality:terraform:plan
    artifacts: true

  # En mode DAG, cette dépendance empêche l'apply de démarrer avant le scan
  # Trivy IaC, sans le coupler aux builds ou releases applicatives.
  - job: quality:trivy:iac
  variables:
    AWS_ROLE_ARN: "$AWS_APPLY_ROLE_ARN"
  resource_group: "$INFRASTRUCTURE_ENVIRONMENT"
  environment:
    name: "$INFRASTRUCTURE_ENVIRONMENT"
    on_stop: deploy:terraform:destroy
  script:
    - >-
      case "$CI_COMMIT_BRANCH:$DEPLOYMENT_ENVIRONMENT:$TF_STATE_NAME:$INFRASTRUCTURE_ENVIRONMENT" in
        "dev:staging:microcrm-staging:aws-poc-staging") ;;
        "$CI_DEFAULT_BRANCH:production:microcrm-production:aws-poc-production") ;;
        *) echo "Périmètre Terraform incohérent avec la branche" >&2; exit 1 ;;
      esac
    - test -f "$CI_PROJECT_DIR/.terraform-plan"
    - test "$TF_STATE_NAME" = "$TF_PLANNED_STATE_NAME"
    - terraform -chdir=infrastructure/terraform init -reconfigure
    - terraform -chdir=infrastructure/terraform apply -auto-approve "$CI_PROJECT_DIR/.terraform-plan"
    - terraform -chdir=infrastructure/terraform output -json > "$CI_PROJECT_DIR/.ci/reports/terraform/outputs.json"
    - printf 'AWS_REGION=%s\n' "$(terraform -chdir=infrastructure/terraform output -raw aws_region)" > "$CI_PROJECT_DIR/.ci/reports/terraform/ansible.env"
    - printf 'ANSIBLE_AWS_SSM_BUCKET_NAME=%s\n' "$(terraform -chdir=infrastructure/terraform output -raw ansible_transfer_bucket)" >> "$CI_PROJECT_DIR/.ci/reports/terraform/ansible.env"
    - printf 'CLOUDWATCH_LOG_GROUP_PREFIX=%s\n' "$(terraform -chdir=infrastructure/terraform output -raw cloudwatch_log_group_prefix)" >> "$CI_PROJECT_DIR/.ci/reports/terraform/ansible.env"
    - printf 'CLOUDWATCH_METRICS_NAMESPACE=%s\n' "$(terraform -chdir=infrastructure/terraform output -raw metrics_namespace)" >> "$CI_PROJECT_DIR/.ci/reports/terraform/ansible.env"
    - printf 'DEPLOYMENT_ENVIRONMENT=%s\n' "$DEPLOYMENT_ENVIRONMENT" >> "$CI_PROJECT_DIR/.ci/reports/terraform/ansible.env"
    - printf 'INFRASTRUCTURE_ENVIRONMENT=%s\n' "$INFRASTRUCTURE_ENVIRONMENT" >> "$CI_PROJECT_DIR/.ci/reports/terraform/ansible.env"
  artifacts:
    expire_in: 1 day
    paths:
      - .ci/reports/terraform/outputs.json
    reports:
      dotenv: .ci/reports/terraform/ansible.env
  rules:
    - if: '$AWS_APPLY_ROLE_ARN == null || $AWS_APPLY_ROLE_ARN == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
      when: on_success

# Le destroy est une action séparée, manuelle et sérialisée. La variable
# TF_DESTROY_CONFIRM et la confirmation native GitLab constituent deux
# garde-fous complémentaires avant la destruction de l'environnement.
deploy:terraform:destroy:
  extends: .terraform:aws-oidc
  stage: terraform
  variables:
    AWS_ROLE_ARN: "$AWS_APPLY_ROLE_ARN"
  resource_group: "$INFRASTRUCTURE_ENVIRONMENT"
  environment:
    name: "$INFRASTRUCTURE_ENVIRONMENT"
    action: stop
  manual_confirmation: "Confirmer la destruction de l'environnement AWS MicroCRM sélectionné"
  script:
    - >-
      case "$CI_COMMIT_BRANCH:$DEPLOYMENT_ENVIRONMENT:$TF_STATE_NAME:$INFRASTRUCTURE_ENVIRONMENT" in
        "dev:staging:microcrm-staging:aws-poc-staging") ;;
        "$CI_DEFAULT_BRANCH:production:microcrm-production:aws-poc-production") ;;
        *) echo "Périmètre Terraform incohérent avec la branche" >&2; exit 1 ;;
      esac
    - test "$TF_DESTROY_CONFIRM" = "true"
    - terraform -chdir=infrastructure/terraform init -reconfigure
    # Ces preuves vérifient que le destroy utilise exclusivement le state
    # associé à l'environnement courant, sans toucher au réseau partagé.
    - printf 'TF_STATE_NAME=%s\nCI_COMMIT_BRANCH=%s\n' "$TF_STATE_NAME" "$CI_COMMIT_BRANCH" > "$CI_PROJECT_DIR/.ci/reports/terraform/destroy-scope.txt"
    - terraform -chdir=infrastructure/terraform plan -destroy -no-color -out="$CI_PROJECT_DIR/.terraform-destroy-plan"
    - 'terraform -chdir=infrastructure/terraform state list > "$CI_PROJECT_DIR/.ci/reports/terraform/destroy-resources.txt" || printf "State vide : aucune ressource suivie.\n" > "$CI_PROJECT_DIR/.ci/reports/terraform/destroy-resources.txt"'
    - terraform -chdir=infrastructure/terraform show -no-color "$CI_PROJECT_DIR/.terraform-destroy-plan" > "$CI_PROJECT_DIR/.ci/reports/terraform/destroy-plan.txt"
    - terraform -chdir=infrastructure/terraform apply -auto-approve "$CI_PROJECT_DIR/.terraform-destroy-plan"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci/reports/terraform/destroy-scope.txt
      - .ci/reports/terraform/destroy-resources.txt
      - .ci/reports/terraform/destroy-plan.txt
  rules:
    - if: '$AWS_APPLY_ROLE_ARN == null || $AWS_APPLY_ROLE_ARN == ""'
      when: never
    # Le job est absent d'un cycle de création normal. Il n'apparaît que dans
    # une pipeline Web explicitement lancée pour détruire un environnement.
    - if: '$CI_PIPELINE_SOURCE == "web" && $TF_DESTROY_CONFIRM == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
      when: manual

# Les jobs runtime Ansible utilisent les outputs Terraform transmis par le
# rapport dotenv et le même rôle AWS temporaire que le provisionnement.
.ansible:aws-oidc:
  image: python:3.12.11-slim-bookworm
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    ANSIBLE_CONFIG: "$CI_PROJECT_DIR/infrastructure/ansible/ansible.cfg"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    AWS_ROLE_ARN: "$AWS_APPLY_ROLE_ARN"
    AWS_WEB_IDENTITY_TOKEN_FILE: "$CI_PROJECT_DIR/.aws/gitlab-oidc-token"
    SESSION_MANAGER_PLUGIN_VERSION: "1.2.835.0"
  cache:
    key:
      files:
        - infrastructure/ansible/requirements-ci.txt
        - infrastructure/ansible/requirements.yml
      prefix: ansible
    paths:
      - .cache/pip/
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.aws"
    - printf '%s' "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - chmod 600 "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - apt-get update && apt-get install --yes --no-install-recommends curl
    # AWS publie un paquet commun Debian/Ubuntu sous ce chemin officiel.
    - curl --fail --silent --show-error "https://s3.amazonaws.com/session-manager-downloads/plugin/${SESSION_MANAGER_PLUGIN_VERSION}/ubuntu_64bit/session-manager-plugin.deb" --output /tmp/session-manager-plugin.deb
    - dpkg --install /tmp/session-manager-plugin.deb
    - session-manager-plugin --version
    - rm -f /tmp/session-manager-plugin.deb && rm -rf /var/lib/apt/lists/*
    - python -m pip install --requirement infrastructure/ansible/requirements-ci.txt
    - ansible-galaxy collection install --requirements-file infrastructure/ansible/requirements.yml
    - >-
      case "$CI_COMMIT_BRANCH:$DEPLOYMENT_ENVIRONMENT:$TF_STATE_NAME:$INFRASTRUCTURE_ENVIRONMENT" in
        "dev:staging:microcrm-staging:aws-poc-staging")
          GITLAB_AGENT_TOKEN="${GITLAB_AGENT_TOKEN_STAGING:-}" ;;
        "$CI_DEFAULT_BRANCH:production:microcrm-production:aws-poc-production")
          GITLAB_AGENT_TOKEN="${GITLAB_AGENT_TOKEN_PRODUCTION:-}" ;;
        *) echo "Périmètre Ansible incohérent avec la branche" >&2; exit 1 ;;
      esac;
      test -n "$GITLAB_AGENT_TOKEN";
      export GITLAB_AGENT_TOKEN

# Le check mode s'exécute automatiquement après l'apply Terraform. Il prouve
# la connexion SSM avant toute configuration réelle.
deploy:ansible:check:
  extends: .ansible:aws-oidc
  stage: ansible
  needs:
    - job: deploy:terraform:apply
      artifacts: true
  resource_group: "$INFRASTRUCTURE_ENVIRONMENT"
  environment:
    name: "$INFRASTRUCTURE_ENVIRONMENT"
    action: prepare
  script:
    - ansible-inventory --graph
    - ansible-playbook --check --diff infrastructure/ansible/playbooks/site.yml
  rules:
    - if: '$AWS_APPLY_ROLE_ARN == null || $AWS_APPLY_ROLE_ARN == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'

# La configuration réelle s'enchaîne automatiquement uniquement si Terraform
# et le check mode Ansible ont réussi.
deploy:ansible:apply:
  extends: .ansible:aws-oidc
  stage: ansible
  needs:
    - job: deploy:terraform:apply
      artifacts: true
    - job: deploy:ansible:check
  resource_group: "$INFRASTRUCTURE_ENVIRONMENT"
  environment:
    name: "$INFRASTRUCTURE_ENVIRONMENT"
  script:
    - ansible-playbook --diff infrastructure/ansible/playbooks/site.yml
  rules:
    - if: '$AWS_APPLY_ROLE_ARN == null || $AWS_APPLY_ROLE_ARN == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
      when: on_success

# Vérifie la syntaxe, l'idempotence déclarative et les conventions Ansible.
test:ansible:
  image: python:3.12.11-slim-bookworm
  stage: test
  variables:
    ANSIBLE_CONFIG: "$CI_PROJECT_DIR/infrastructure/ansible/ansible.cfg"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - infrastructure/ansible/requirements-ci.txt
        - infrastructure/ansible/requirements.yml
      prefix: ansible
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --requirement infrastructure/ansible/requirements-ci.txt
    - ansible-galaxy collection install --requirements-file infrastructure/ansible/requirements.yml
  script:
    # L'inventaire local évite tout appel AWS pendant le simple contrôle syntaxique.
    - ansible-playbook --syntax-check --inventory localhost, infrastructure/ansible/playbooks/site.yml
    - ansible-lint infrastructure/ansible/

# Trivy conserve toutes les observations élevées mais bloque uniquement les
# mauvaises configurations critiques, comme la politique de sécurité du projet.
quality:trivy:iac:
  extends: .trivy-job
  stage: quality
  needs:
    - test:terraform
    - test:ansible
  script:
    - mkdir -p .ci/reports/security
    - >-
      trivy config
      --severity HIGH,CRITICAL
      --format json
      --output .ci/reports/security/trivy-iac.json
      infrastructure/terraform
    - >-
      trivy convert
      --severity HIGH,CRITICAL
      --format table
      --output .ci/reports/security/trivy-iac.txt
      .ci/reports/security/trivy-iac.json
    - >-
      trivy config
      --severity CRITICAL
      --exit-code 1
      --format table
      --output /dev/null
      infrastructure/terraform
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci/reports/security/trivy-iac.json
      - .ci/reports/security/trivy-iac.txt
