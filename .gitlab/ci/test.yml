# Lance Karma/Jasmine dans un navigateur Chrome sans interface graphique.
test:frontend:
  extends: .frontend-node
  # Cette image ajoute les navigateurs absents de l'image Node générique.
  image: cypress/browsers:node-20.10.0-chrome-121.0.6167.85-1-ff-118.0.2-edge-118.0.2088.46-1
  stage: test
  script:
    # `CHROME_BIN` indique à Karma le chemin exact du navigateur dans le conteneur.
    - CHROME_BIN=/opt/google/chrome/chrome bash scripts/ci/test.sh --component frontend
  # GitLab extrait le pourcentage depuis les logs et l'affiche dans l'interface.
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    # `always` conserve les rapports même si un test échoue, ce qui aide au diagnostic.
    when: always
    expire_in: 7 days
    paths:
      - front/coverage/
  rules:
    # Un tag SemVer promeut une image SHA déjà testée sur sa branche source.
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/'
      when: never
    - when: on_success

# Exécute les tests JUnit et prépare les données de couverture/analyse Java.
test:backend:
  extends: .backend-java
  stage: test
  script:
    - bash scripts/ci/test.sh --component backend
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      # Le rapport JUnit alimente directement l'onglet Tests de GitLab.
      junit: back/build/test-results/test/*.xml
    paths:
      # Les chemins suivants sont aussi consommés par SonarQube ou consultables.
      - back/build/reports/tests/test/
      - back/build/reports/jacoco/test/jacocoTestReport.xml
      - back/build/reports/jacoco/test/html/
      - back/build/classes/java/main/
      - back/build/classes/java/test/
      - back/build/sonar-libraries/
  rules:
    # Un tag SemVer promeut une image SHA déjà testée sur sa branche source.
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/'
      when: never
    - when: on_success

# Vérifie rapidement les interfaces et garde-fous des scripts Bash.
test:scripts:bash:
  image: node:20.19.5-bookworm-slim
  stage: test
  script:
    - bash scripts/ci/tests/test_scripts.sh

# Exécute pytest dans un environnement Python isolé du code applicatif.
test:scripts:python:
  image: python:3.12.11-slim
  stage: test
  before_script:
    # Seules les dépendances de test déclarées sont installées, sans cache persistant.
    - python -m pip install --disable-pip-version-check --no-cache-dir -r scripts/ci/requirements-test.txt
  script:
    - mkdir -p .ci/reports
    - python -m pytest scripts/ci/tests/ --junitxml=.ci/reports/scripts-python.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      # pytest produit un XML compris nativement par GitLab.
      junit: .ci/reports/scripts-python.xml
    paths:
      - .ci/reports/scripts-python.xml

# Valide le chart avant tout accès à un cluster Kubernetes.
test:helm:
  image:
    name: alpine/helm:3.18.6
    entrypoint: [""]
  stage: test
  script:
    # `lint` vérifie la structure du chart et chaque variante de values.
    - helm lint infrastructure/helm/microcrm --values infrastructure/helm/microcrm/values-minikube.yaml
    - helm lint infrastructure/helm/microcrm --values infrastructure/helm/microcrm/values-k3s.yaml
    - helm lint infrastructure/helm/microcrm --values infrastructure/helm/microcrm/values-staging.yaml
    - helm lint infrastructure/helm/microcrm --values infrastructure/helm/microcrm/values-production.yaml
    - >-
      helm lint infrastructure/helm/microcrm
      --values infrastructure/helm/microcrm/values-production.yaml
      --set canary.enabled=true
      --set-string canary.version=v1.3.0
      --set-string canary.frontend.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      --set-string canary.backend.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    # `template` prouve que les ressources locales et AWS peuvent être générées.
    - helm template microcrm infrastructure/helm/microcrm --namespace microcrm --values infrastructure/helm/microcrm/values-minikube.yaml > /dev/null
    - helm template microcrm infrastructure/helm/microcrm --namespace microcrm --values infrastructure/helm/microcrm/values-k3s.yaml > /dev/null
    - helm template microcrm infrastructure/helm/microcrm --namespace microcrm-staging --values infrastructure/helm/microcrm/values-staging.yaml > /dev/null
    - helm template microcrm infrastructure/helm/microcrm --namespace microcrm-prod --values infrastructure/helm/microcrm/values-production.yaml > /dev/null
    - >-
      helm template microcrm infrastructure/helm/microcrm
      --namespace microcrm-prod
      --values infrastructure/helm/microcrm/values-production.yaml
      --set-string release.version=v1.2.0
      --set canary.enabled=true
      --set-string canary.version=v1.3.0
      --set-string canary.frontend.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      --set-string canary.backend.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      > /tmp/microcrm-canary.yaml
    - 'test "$(grep -c "^kind: Deployment$" /tmp/microcrm-canary.yaml)" = "4"'
    - 'test "$(grep -c "microcrm.io/track: \"canary\"" /tmp/microcrm-canary.yaml)" -ge "4"'
    - 'grep -q "kind: TraefikService" /tmp/microcrm-canary.yaml'
    - 'grep -q "weight: 90" /tmp/microcrm-canary.yaml'
    - 'grep -q "weight: 10" /tmp/microcrm-canary.yaml'
    - >-
      ! helm template microcrm infrastructure/helm/microcrm
      --namespace microcrm-prod
      --values infrastructure/helm/microcrm/values-production.yaml
      --set canary.enabled=true
      --set-string canary.version=v1.3.0
      > /dev/null
    - >-
      ! helm template microcrm infrastructure/helm/microcrm
      --namespace microcrm-prod
      --values infrastructure/helm/microcrm/values-production.yaml
      --set canary.enabled=true
      --set canary.stableWeight=90
      --set canary.canaryWeight=20
      --set-string canary.version=v1.3.0
      --set-string canary.frontend.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      --set-string canary.backend.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      > /dev/null
    - '! helm template microcrm infrastructure/helm/microcrm --namespace microcrm-prod --values infrastructure/helm/microcrm/values-production.yaml | grep -q "microcrm-prod-canary"'
    # Deux occurrences sont attendues : une pour frontend et une pour backend.
    - 'test "$(helm template microcrm infrastructure/helm/microcrm --values infrastructure/helm/microcrm/values-staging.yaml | grep -c "^  replicas: 2$")" = "2"'
    - 'test "$(helm template microcrm infrastructure/helm/microcrm --values infrastructure/helm/microcrm/values-staging.yaml | grep -c "^        podAntiAffinity:$")" = "2"'
    # Couvre aussi le chemin réellement utilisé par le déploiement AWS, avec
    # uniquement de fausses valeurs encodées pour les deux Secrets gérés.
    - >-
      helm template microcrm infrastructure/helm/microcrm
      --namespace microcrm
      --values infrastructure/helm/microcrm/values-k3s.yaml
      --set registrySecret.enabled=true
      --set-string registrySecret.server=registry.gitlab.com
      --set-string registrySecret.usernameBase64=Z2l0bGFi
      --set-string registrySecret.passwordBase64=dG9rZW4=
      --set database.managedSecret.enabled=true
      --set-string database.managedSecret.passwordBase64=dGVzdA==
      > /dev/null
