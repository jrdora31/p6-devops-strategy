# Analyse statiquement tous les scripts Shell : erreurs de syntaxe probables,
# variables mal protégées et constructions Bash fragiles.
quality:shellcheck:
  image:
    name: koalaman/shellcheck-alpine:v0.11.0
    # Permet à GitLab d'exécuter la commande ShellCheck donnée dans `script`.
    entrypoint: [""]
  stage: quality
  script:
    - shellcheck scripts/ci/*.sh scripts/ci/tests/*.sh

# Recherche les secrets dans l'historique Git avant la construction des images.
quality:gitleaks:
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  stage: quality
  variables:
    # Un clone complet permet d'analyser tous les commits accessibles depuis la ref.
    GIT_DEPTH: "0"
  script:
    - mkdir -p .ci/reports/security
    - >-
      gitleaks git
      --redact
      --exit-code 1
      --report-format json
      --report-path .ci/reports/security/gitleaks.json
      .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci/reports/security/gitleaks.json

# Inspecte les dépendances du dépôt avant la construction des images.
quality:trivy:repository:
  # Réutilise l'image, la base en cache et les options communes de Trivy.
  extends: .trivy-job
  stage: quality
  script:
    # Tous les rapports de sécurité sont regroupés sous un chemin prévisible.
    - mkdir -p .ci/reports/security
    # `>-` est un scalaire YAML replié : les lignes visuelles ci-dessous sont
    # envoyées au shell comme une seule commande séparée par des espaces. Cette
    # première commande recherche les dépendances vulnérables (pas les secrets),
    # garde les sévérités élevées et exclut les dossiers générés ou mis en cache.
    - >-
      trivy filesystem
      --scanners vuln
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --skip-dirs "$TRIVY_CACHE_DIR"
      --skip-dirs .git
      --skip-dirs front/.angular
      --skip-dirs front/node_modules
      --skip-dirs front/dist
      --skip-dirs back/build
      --format json
      --output .ci/reports/security/trivy-repository-vulnerabilities.json
      .
    # Convertit le JSON de référence en tableau lisible par une personne.
    - >-
      trivy convert
      --severity HIGH,CRITICAL
      --format table
      --output .ci/reports/security/trivy-repository-vulnerabilities.txt
      .ci/reports/security/trivy-repository-vulnerabilities.json
    # Relit le même JSON et retourne un code non nul si une CVE critique existe.
    - >-
      trivy convert
      --severity CRITICAL
      --exit-code 1
      --format table
      --output /dev/null
      .ci/reports/security/trivy-repository-vulnerabilities.json
  artifacts:
    # Les rapports restent disponibles même lorsque Trivy bloque le job.
    when: always
    expire_in: 30 days
    paths:
      - .ci/reports/security/trivy-repository-vulnerabilities.json
      - .ci/reports/security/trivy-repository-vulnerabilities.txt
  after_script:
    # Un job Trivy en échec signale une vulnérabilité critique ou une erreur du scanner.
    - >-
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
        apk add --no-cache python3 >/dev/null &&
        python3 scripts/ci/notify.py --event vulnerability --status failed
        --job "$CI_JOB_NAME" --pipeline-id "$CI_PIPELINE_ID"
        --pipeline-url "$CI_PIPELINE_URL" --ref "$CI_COMMIT_REF_NAME"
        --commit "$CI_COMMIT_SHA" --send-webhook-env SLACK_WEBHOOK_URL;
      fi

# Analyse les ressources Kubernetes générées par Helm avant leur déploiement.
quality:trivy:kubernetes:
  extends: .trivy-job
  stage: quality
  script:
    - mkdir -p .ci/reports/security
    - >-
      trivy config
      --helm-kube-version 1.30.0
      --helm-values infrastructure/helm/microcrm/values-minikube.yaml
      --severity HIGH,CRITICAL
      --format json
      --output .ci/reports/security/trivy-kubernetes-minikube.json
      infrastructure/helm/microcrm
    - >-
      trivy config
      --helm-kube-version 1.30.0
      --helm-values infrastructure/helm/microcrm/values-minikube.yaml
      --severity HIGH,CRITICAL
      --exit-code 1
      --format table
      --output .ci/reports/security/trivy-kubernetes-minikube.txt
      infrastructure/helm/microcrm
    - >-
      trivy config
      --helm-kube-version 1.30.0
      --helm-values infrastructure/helm/microcrm/values-k3s.yaml
      --severity HIGH,CRITICAL
      --format json
      --output .ci/reports/security/trivy-kubernetes-k3s.json
      infrastructure/helm/microcrm
    - >-
      trivy config
      --helm-kube-version 1.30.0
      --helm-values infrastructure/helm/microcrm/values-k3s.yaml
      --severity HIGH,CRITICAL
      --exit-code 1
      --format table
      --output .ci/reports/security/trivy-kubernetes-k3s.txt
      infrastructure/helm/microcrm
    - >-
      trivy config
      --helm-kube-version 1.30.0
      --helm-values infrastructure/helm/microcrm/values-staging.yaml
      --severity HIGH,CRITICAL
      --format json
      --output .ci/reports/security/trivy-kubernetes-staging.json
      infrastructure/helm/microcrm
    - >-
      trivy config
      --helm-kube-version 1.30.0
      --helm-values infrastructure/helm/microcrm/values-staging.yaml
      --severity HIGH,CRITICAL
      --exit-code 1
      --format table
      --output .ci/reports/security/trivy-kubernetes-staging.txt
      infrastructure/helm/microcrm
    - >-
      trivy config
      --helm-kube-version 1.30.0
      --helm-values infrastructure/helm/microcrm/values-production.yaml
      --severity HIGH,CRITICAL
      --format json
      --output .ci/reports/security/trivy-kubernetes-production.json
      infrastructure/helm/microcrm
    - >-
      trivy config
      --helm-kube-version 1.30.0
      --helm-values infrastructure/helm/microcrm/values-production.yaml
      --severity HIGH,CRITICAL
      --exit-code 1
      --format table
      --output .ci/reports/security/trivy-kubernetes-production.txt
      infrastructure/helm/microcrm
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci/reports/security/trivy-kubernetes-minikube.json
      - .ci/reports/security/trivy-kubernetes-minikube.txt
      - .ci/reports/security/trivy-kubernetes-k3s.json
      - .ci/reports/security/trivy-kubernetes-k3s.txt
      - .ci/reports/security/trivy-kubernetes-staging.json
      - .ci/reports/security/trivy-kubernetes-staging.txt
      - .ci/reports/security/trivy-kubernetes-production.json
      - .ci/reports/security/trivy-kubernetes-production.txt
  after_script:
    - >-
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
        apk add --no-cache python3 >/dev/null &&
        python3 scripts/ci/notify.py --event vulnerability --status failed
        --job "$CI_JOB_NAME" --pipeline-id "$CI_PIPELINE_ID"
        --pipeline-url "$CI_PIPELINE_URL" --ref "$CI_COMMIT_REF_NAME"
        --commit "$CI_COMMIT_SHA" --send-webhook-env SLACK_WEBHOOK_URL;
      fi

# Envoie à SonarQube le code et les rapports produits par les deux jobs de test.
quality:sonarqube:
  image:
    name: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    entrypoint: [""]
  stage: quality
  variables:
    # Cache local du scanner, distinct des caches npm et Gradle.
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    # L'historique Git complet est requis pour attribuer correctement le nouveau code.
    GIT_DEPTH: "0"
  cache:
    key: sonar
    paths:
      - .sonar/cache/
  # `dependencies` télécharge les artifacts des tests, notamment couverture et classes.
  dependencies:
    - test:frontend
    - test:backend
  script:
    # Le job attend la décision du Quality Gate et échoue si celui-ci refuse l'analyse.
    - sonar-scanner -Dsonar.qualitygate.wait=true
  rules:
    # Limite l'analyse aux moments où son résultat influence une intégration.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
