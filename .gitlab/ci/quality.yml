quality:shellcheck:
  image:
    name: koalaman/shellcheck-alpine:v0.11.0
    entrypoint: [""]
  stage: quality
  script:
    - shellcheck scripts/ci/*.sh scripts/ci/tests/*.sh

quality:sonarqube:
  image:
    name: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    entrypoint: [""]
  stage: quality
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar
    paths:
      - .sonar/cache/
  dependencies:
    - test:frontend
    - test:backend
  script:
    - sonar-scanner -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
