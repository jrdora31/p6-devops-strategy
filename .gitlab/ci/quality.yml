quality:shellcheck:
  image:
    name: koalaman/shellcheck-alpine:v0.11.0
    entrypoint: [""]
  stage: quality
  script:
    - shellcheck scripts/ci/*.sh scripts/ci/tests/*.sh

quality:sonarqube:
  image:
    name: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    entrypoint: [""]
  stage: quality
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.cache/gradle"
    GIT_DEPTH: "0"
  cache:
    - key: sonar
      paths:
        - .sonar/cache/
    - key:
        files:
          - back/gradle/wrapper/gradle-wrapper.properties
          - back/build.gradle
        prefix: backend
      paths:
        - .cache/gradle/wrapper/
        - .cache/gradle/caches/
  dependencies:
    - test:frontend
    - test:backend
  script:
    - back/gradlew --no-daemon -p back copySonarLibraries
    - sonar-scanner -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
