# Déploie automatiquement les images publiées avec le chart testé plus tôt.
# Le job échoue explicitement si l'infrastructure K3s, le GitLab Agent ou les
# variables protégées ne sont pas disponibles.
deploy:helm:aws:
  image:
    name: alpine/helm:3.18.6@sha256:c6d8088ddb279625a2e1ca3b08b22c18c946d1f65c8b810f28f1597435a1134c
    entrypoint: [""]
  stage: deploy
  needs:
    - job: release:images
      artifacts: true
    - job: release:helm:package
      artifacts: true
    # Dans une pipeline Web sur main, Helm attend la configuration complète de
    # K3s. Ce job IaC n'existe pas dans une pipeline de tag, d'où optional.
    - job: deploy:ansible:apply
      optional: true
  resource_group: aws-poc
  environment:
    name: aws-poc
  variables:
    KUBE_CONTEXT: "project_6_group/microcrm:microcrm-poc"
    KUBERNETES_REGISTRY_SECRET: microcrm-registry
    KUBERNETES_DATABASE_SECRET: microcrm-database
  script:
    # Le GitLab Agent injecte ce kubeconfig. Aucun accès entrant à l'API K3s
    # ni variable KUBE_CONFIG personnalisée n'est nécessaire.
    - 'test -s "$KUBECONFIG"'
    - 'test -n "$KUBE_CONTEXT"'
    - 'test -n "$CI_DEPLOY_USER"'
    - 'test -n "$CI_DEPLOY_PASSWORD"'
    - 'test -n "$KUBERNETES_DATABASE_PASSWORD"'
    # Les valeurs sont encodées afin de les transmettre au chart sans les
    # afficher ni les écrire dans un artifact du pipeline.
    - REGISTRY_USERNAME_B64="$(printf '%s' "$CI_DEPLOY_USER" | base64 | tr -d '\n')"
    - REGISTRY_PASSWORD_B64="$(printf '%s' "$CI_DEPLOY_PASSWORD" | base64 | tr -d '\n')"
    - DATABASE_PASSWORD_B64="$(printf '%s' "$KUBERNETES_DATABASE_PASSWORD" | base64 | tr -d '\n')"
    - FRONTEND_REPOSITORY="${FRONTEND_IMAGE_DIGEST%@*}"
    - FRONTEND_DIGEST="${FRONTEND_IMAGE_DIGEST#*@}"
    - BACKEND_REPOSITORY="${BACKEND_IMAGE_DIGEST%@*}"
    - BACKEND_DIGEST="${BACKEND_IMAGE_DIGEST#*@}"
    - >-
      helm upgrade --install microcrm .ci/packages/microcrm-*.tgz
      --kube-context "$KUBE_CONTEXT"
      --namespace microcrm
      --create-namespace
      --values helm/microcrm/values-k3s.yaml
      --set-string "frontend.image.repository=$FRONTEND_REPOSITORY"
      --set-string "frontend.image.digest=$FRONTEND_DIGEST"
      --set-string "backend.image.repository=$BACKEND_REPOSITORY"
      --set-string "backend.image.digest=$BACKEND_DIGEST"
      --set-string "imagePullSecrets[0].name=$KUBERNETES_REGISTRY_SECRET"
      --set "registrySecret.enabled=true"
      --set-string "registrySecret.name=$KUBERNETES_REGISTRY_SECRET"
      --set-string "registrySecret.server=$CI_REGISTRY"
      --set-string "registrySecret.usernameBase64=$REGISTRY_USERNAME_B64"
      --set-string "registrySecret.passwordBase64=$REGISTRY_PASSWORD_B64"
      --set-string "database.existingSecret=$KUBERNETES_DATABASE_SECRET"
      --set "database.managedSecret.enabled=true"
      --set-string "database.managedSecret.username=microcrm"
      --set-string "database.managedSecret.passwordBase64=$DATABASE_PASSWORD_B64"
      --atomic
      --wait
      --timeout 5m
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
  # Le déploiement reste non bloquant tant que l'environnement AWS n'est pas
  # provisionné. Son exécution échoue néanmoins si ses prérequis sont absents
  # ou si Helm ne parvient pas à stabiliser la release.
  allow_failure: true
