# Base commune aux déploiements applicatifs dans les deux environnements du
# même cluster K3s. Les namespaces et les values isolent staging et production.
.deploy:helm:k3s:
  image:
    name: alpine/helm:3.18.6
    entrypoint: [""]
  stage: helm
  resource_group: aws-poc
  variables:
    KUBE_CONTEXT: "project_6_group/microcrm:microcrm-poc"
    KUBERNETES_REGISTRY_SECRET: microcrm-registry
    KUBERNETES_DATABASE_SECRET: microcrm-database
  script:
    # Le GitLab Agent injecte ce kubeconfig. Aucun accès entrant à l'API K3s
    # ni variable KUBE_CONFIG personnalisée n'est nécessaire.
    - 'test -s "$KUBECONFIG"'
    - 'test -n "$KUBE_CONTEXT"'
    - 'test -n "$CI_DEPLOY_USER"'
    - 'test -n "$CI_DEPLOY_PASSWORD"'
    - 'test -n "$KUBERNETES_DATABASE_PASSWORD"'
    # Une pipeline de tag recharge la release durable. Une pipeline Web `dev`
    # continue d'utiliser directement les artifacts de sa propre construction.
    - >-
      if [ -n "$CI_COMMIT_TAG" ]; then
        apk add --no-cache curl;
        RELEASE_VERSION="$CI_COMMIT_TAG";
        CHART_VERSION="${CI_COMMIT_TAG#v}";
        RELEASE_BASE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/microcrm-release/$RELEASE_VERSION";
        mkdir -p .ci/release .ci/packages;
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" "$RELEASE_BASE_URL/images.env" --output .ci/release/images.env;
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" "$RELEASE_BASE_URL/release-manifest.json" --output .ci/release/release-manifest.json;
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" "$RELEASE_BASE_URL/microcrm-$CHART_VERSION.tgz" --output ".ci/packages/microcrm-$CHART_VERSION.tgz";
        . .ci/release/images.env;
        export FRONTEND_IMAGE_DIGEST BACKEND_IMAGE_DIGEST;
        test -s .ci/release/release-manifest.json;
      fi
    - 'printf "%s" "$FRONTEND_IMAGE_DIGEST" | grep -Eq "^.+@sha256:[0-9a-f]{64}$"'
    - 'printf "%s" "$BACKEND_IMAGE_DIGEST" | grep -Eq "^.+@sha256:[0-9a-f]{64}$"'
    # Les valeurs sont encodées afin de les transmettre au chart sans les
    # afficher ni les écrire dans un artifact du pipeline.
    - REGISTRY_USERNAME_B64="$(printf '%s' "$CI_DEPLOY_USER" | base64 | tr -d '\n')"
    - REGISTRY_PASSWORD_B64="$(printf '%s' "$CI_DEPLOY_PASSWORD" | base64 | tr -d '\n')"
    - DATABASE_PASSWORD_B64="$(printf '%s' "$KUBERNETES_DATABASE_PASSWORD" | base64 | tr -d '\n')"
    - FRONTEND_REPOSITORY="${FRONTEND_IMAGE_DIGEST%@*}"
    - FRONTEND_DIGEST="${FRONTEND_IMAGE_DIGEST#*@}"
    - BACKEND_REPOSITORY="${BACKEND_IMAGE_DIGEST%@*}"
    - BACKEND_DIGEST="${BACKEND_IMAGE_DIGEST#*@}"
    - >-
      helm upgrade --install microcrm .ci/packages/microcrm-*.tgz
      --kube-context "$KUBE_CONTEXT"
      --namespace "$KUBE_NAMESPACE"
      --create-namespace
      --values "$HELM_VALUES"
      --set-string "frontend.image.repository=$FRONTEND_REPOSITORY"
      --set-string "frontend.image.digest=$FRONTEND_DIGEST"
      --set-string "backend.image.repository=$BACKEND_REPOSITORY"
      --set-string "backend.image.digest=$BACKEND_DIGEST"
      --set-string "imagePullSecrets[0].name=$KUBERNETES_REGISTRY_SECRET"
      --set "registrySecret.enabled=true"
      --set-string "registrySecret.name=$KUBERNETES_REGISTRY_SECRET"
      --set-string "registrySecret.server=$CI_REGISTRY"
      --set-string "registrySecret.usernameBase64=$REGISTRY_USERNAME_B64"
      --set-string "registrySecret.passwordBase64=$REGISTRY_PASSWORD_B64"
      --set-string "database.existingSecret=$KUBERNETES_DATABASE_SECRET"
      --set "database.managedSecret.enabled=true"
      --set-string "database.managedSecret.username=microcrm"
      --set-string "database.managedSecret.passwordBase64=$DATABASE_PASSWORD_B64"
      --atomic
      --wait
      --timeout 5m
  after_script:
    # `CI_JOB_STATUS` est disponible dans `after_script`, y compris si Helm a
    # échoué. Le webhook n'est jamais passé en argument ni affiché dans les logs.
    - >-
      if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
        apk add --no-cache python3 >/dev/null &&
        python3 scripts/ci/notify.py --event deployment --status "$CI_JOB_STATUS" --job "$CI_JOB_NAME" --pipeline-id "$CI_PIPELINE_ID" --pipeline-url "$CI_PIPELINE_URL" --ref "$CI_COMMIT_REF_NAME" --commit "$CI_COMMIT_SHA" --send-webhook-env SLACK_WEBHOOK_URL;
      else
        echo "Notification Slack ignorée : SLACK_WEBHOOK_URL indisponible.";
      fi

# `dev` constitue l'environnement d'intégration : les pipelines publient les
# images contrôlées. Le déploiement staging s'exécute uniquement dans une
# pipeline Web autorisée à provisionner l'infrastructure AWS éphémère.
deploy:helm:staging:
  extends: .deploy:helm:k3s
  needs:
    - job: release:images
      artifacts: true
    - job: release:helm:package
      artifacts: true
    - job: deploy:ansible:apply
      optional: true
  environment:
    name: aws-poc-staging
  variables:
    KUBE_NAMESPACE: microcrm-staging
    HELM_VALUES: infrastructure/helm/microcrm/values-staging.yaml
  rules:
    - if: '$AWS_APPLY_ROLE_ARN == null || $AWS_APPLY_ROLE_ARN == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "dev"'
      when: on_success
  allow_failure: false

# Promotion ou rollback de staging par release : ce job ne dépend que du
# bundle durable du tag, jamais d'artifacts de build temporaires.
deploy:helm:release:staging:
  extends: .deploy:helm:k3s
  needs:
    - job: release:bundle
      artifacts: false
  environment:
    name: aws-poc-staging
  variables:
    KUBE_NAMESPACE: microcrm-staging
    HELM_VALUES: infrastructure/helm/microcrm/values-staging.yaml
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$/'
      when: manual
  allow_failure: false

# La production est une promotion explicite d'un tag SemVer. Le job manuel
# recharge les images et le chart archivés pour ce tag. Relancer le job d'une
# ancienne pipeline constitue le rollback vers cette release exacte.
deploy:helm:aws:
  extends: .deploy:helm:k3s
  needs:
    - job: release:bundle
      artifacts: false
  environment:
    name: aws-poc-production
  variables:
    KUBE_NAMESPACE: microcrm-prod
    HELM_VALUES: infrastructure/helm/microcrm/values-production.yaml
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
      when: manual
  allow_failure: false
