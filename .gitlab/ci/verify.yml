# Vérification finale : exécute ensemble les deux images réellement construites.
verify:images:
  extends: .docker-job
  stage: verify
  needs:
    # Les archives Docker sont obligatoires pour restaurer les images dans ce job.
    - job: build:image:frontend
      artifacts: true
    - job: build:image:backend
      artifacts: true
    # Les jobs de scan ne sont pas toujours créés par leurs `rules`. `optional`
    # évite alors une erreur de configuration tout en les attendant s'ils existent.
    - job: release:scan:image:frontend
      artifacts: false
      optional: true
    - job: release:scan:image:backend
      artifacts: false
      optional: true
  script:
    # Chaque job Docker possède un daemon isolé : il faut donc recharger les archives.
    - docker load --input .ci/images/frontend.tar
    - docker load --input .ci/images/backend.tar
    # Le script crée un réseau temporaire, attend les healthchecks puis teste `/api`.
    - >-
      sh scripts/ci/smoke.sh
      --frontend-image "$FRONTEND_IMAGE"
      --backend-image "$BACKEND_IMAGE"
      --database-image "$POSTGRES_IMAGE"

# Vérifie l'application réellement déployée sur K3s après Helm. Ce contrôle est
# distinct du smoke test Docker ci-dessus : il utilise le contexte du GitLab
# Agent et les ressources présentes sur AWS.
verify:kubernetes:aws:
  image:
    name: alpine/helm:3.18.6@sha256:c6d8088ddb279625a2e1ca3b08b22c18c946d1f65c8b810f28f1597435a1134c
    entrypoint: [""]
  stage: verify
  needs:
    - job: deploy:helm:aws
  environment:
    name: aws-poc
  variables:
    KUBE_CONTEXT: "project_6_group/microcrm:microcrm-poc"
    KUBECTL_VERSION: "v1.30.14"
    KUBECTL_AMD64_SHA256: "7ccac981ece0098284d8961973295f5124d78eab7b89ba5023f35591baa16271"
  before_script:
    - apk add --no-cache curl
    - curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output /usr/local/bin/kubectl
    - echo "${KUBECTL_AMD64_SHA256}  /usr/local/bin/kubectl" | sha256sum --check
    - chmod 0755 /usr/local/bin/kubectl
  script:
    - 'test -s "$KUBECONFIG"'
    - >-
      sh scripts/ci/verify_kubernetes.sh
      --context "$KUBE_CONTEXT"
      --namespace microcrm
      --release microcrm
      --expected-host microcrm.example.invalid
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: false
