sonar.projectKey=project_6_group_microcrm
sonar.organization=project-6-group
sonar.projectName=MicroCRM
sonar.sourceEncoding=UTF-8

# L'application est livree comme un ensemble frontend/backend unique.
sonar.sources=front/src,back/src/main/java,scripts/ci
sonar.tests=front/src,back/src/test/java,scripts/ci/tests
sonar.exclusions=front/src/**/*.spec.ts,front/src/favicon.png,scripts/ci/tests/**
sonar.test.inclusions=front/src/**/*.spec.ts,back/src/test/**/*.java,scripts/ci/tests/**

# Les jobs de test produisent ces rapports avant le stage quality.
sonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml

# Le seuil de couverture mesure le code applicatif Angular et Java. Les scripts
# CI restent analyses par SonarQube et testes par pytest, Bash et ShellCheck.
sonar.coverage.exclusions=scripts/ci/**

# Le scanner CLI analyse les classes Java compilees par test:backend.
sonar.java.binaries=back/build/classes/java/main
sonar.java.test.binaries=back/build/classes/java/test
sonar.java.libraries=back/build/sonar-libraries/main/*.jar
sonar.java.test.libraries=back/build/sonar-libraries/main/*.jar,back/build/sonar-libraries/test/*.jar
sonar.java.source=17
sonar.python.version=3.12
