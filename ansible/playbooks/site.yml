---
- name: Configurer le serveur K3s du POC MicroCRM
  hosts: k3s_servers
  gather_facts: false
  become: true
  vars:
    ansible_connection: amazon.aws.aws_ssm
    ansible_aws_ssm_bucket_name: >-
      {{ lookup('ansible.builtin.env', 'ANSIBLE_AWS_SSM_BUCKET_NAME') }}
    ansible_aws_ssm_region: >-
      {{ lookup('ansible.builtin.env', 'AWS_REGION') | default('eu-west-3', true) }}

  pre_tasks:
    - name: Vérifier la variable du bucket temporaire SSM
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'ANSIBLE_AWS_SSM_BUCKET_NAME') | length > 0
        fail_msg: >-
          ANSIBLE_AWS_SSM_BUCKET_NAME doit contenir l'output Terraform
          ansible_transfer_bucket.

    - name: Attendre que Systems Manager accepte la connexion
      ansible.builtin.wait_for_connection:
        timeout: 300
      check_mode: false

    - name: Collecter les informations du serveur après connexion
      ansible.builtin.setup:

  roles:
    - role: common
    - role: k3s_server
