<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
  <title id="title">Workflow CI actuel de MicroCRM</title>
  <desc id="desc">État audité du pipeline GitLab CI et du flux Docker manuel, distinguant les faits observés, les opérations reproduites, les pratiques déclarées et les fonctions absentes.</desc>

  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .group { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 18; }
      .stage { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .observed { fill: #e8f1fb; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .reproduced { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 10; }
      .declared { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; stroke-dasharray: 8 6; rx: 10; }
      .gap { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .gate { fill: #e8f1fb; stroke: #2563eb; stroke-width: 2; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .group-title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .stage-title { font: 700 18px Arial, sans-serif; fill: #334155; }
      .label { font: 600 17px Arial, sans-serif; fill: #172554; text-anchor: middle; }
      .label-green { font: 600 17px Arial, sans-serif; fill: #064e3b; text-anchor: middle; }
      .label-orange { font: 600 17px Arial, sans-serif; fill: #7c2d12; text-anchor: middle; }
      .label-red { font: 600 17px Arial, sans-serif; fill: #7f1d1d; text-anchor: middle; }
      .small { font: 400 15px Arial, sans-serif; }
      .edge-label { font: 600 14px Arial, sans-serif; fill: #475569; }
      .legend { font: 400 15px Arial, sans-serif; fill: #334155; }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .arrow-orange { fill: none; stroke: #ea580c; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow-orange); }
      .arrow-red { fill: none; stroke: #dc2626; stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-red); }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="1500"/>
  <text class="title" x="800" y="38" text-anchor="middle">Workflow CI actuel — MicroCRM</text>

  <!-- Flux CI observé -->
  <rect class="group" x="50" y="60" width="940" height="1380"/>
  <text class="group-title" x="80" y="98">Flux observé dans .gitlab-ci.yml</text>

  <rect class="observed" x="365" y="125" width="310" height="70"/>
  <text class="label" x="520" y="168">Développeur</text>

  <rect class="observed" x="365" y="235" width="310" height="70"/>
  <text class="label" x="520" y="278">Dépôt GitLab</text>

  <rect class="observed" x="365" y="345" width="310" height="70"/>
  <text class="label" x="520" y="388">Pipeline GitLab CI</text>

  <path class="arrow-blue" d="M 520 195 L 520 235"/>
  <text class="edge-label" x="536" y="221">push</text>
  <path class="arrow-blue" d="M 520 305 L 520 345"/>

  <rect class="stage" x="150" y="465" width="740" height="210"/>
  <text class="stage-title" x="520" y="498" text-anchor="middle">Stage test — jobs parallèles</text>

  <rect class="observed" x="205" y="525" width="280" height="110"/>
  <text class="label" x="345" y="556">
    <tspan x="345" dy="0">test-front</tspan>
    <tspan class="small" x="345" dy="25">npm ci</tspan>
    <tspan class="small" x="345" dy="22">8 tests Angular</tspan>
  </text>

  <rect class="observed" x="555" y="525" width="280" height="110"/>
  <text class="label" x="695" y="556">
    <tspan x="695" dy="0">test-back</tspan>
    <tspan class="small" x="695" dy="25">./gradlew test</tspan>
    <tspan class="small" x="695" dy="22">2 tests JUnit</tspan>
  </text>

  <path class="arrow-blue" d="M 520 415 L 520 445 L 345 445 L 345 525"/>
  <path class="arrow-blue" d="M 520 415 L 520 445 L 695 445 L 695 525"/>

  <polygon class="gate" points="520,705 585,755 520,805 455,755"/>
  <text class="label small" x="520" y="747">
    <tspan x="520" dy="0">Condition</tspan>
    <tspan x="520" dy="19">2 jobs réussis</tspan>
  </text>
  <path class="arrow-blue" d="M 345 635 L 345 690 L 455 755"/>
  <path class="arrow-blue" d="M 695 635 L 695 690 L 585 755"/>

  <rect class="stage" x="150" y="835" width="740" height="240"/>
  <text class="stage-title" x="520" y="868" text-anchor="middle">Stage build — jobs parallèles</text>

  <rect class="observed" x="205" y="900" width="280" height="130"/>
  <text class="label" x="345" y="930">
    <tspan x="345" dy="0">build-front</tspan>
    <tspan class="small" x="345" dy="25">npm ci relancé</tspan>
    <tspan class="small" x="345" dy="22">build Angular</tspan>
  </text>

  <rect class="observed" x="555" y="900" width="280" height="130"/>
  <text class="label" x="695" y="930">
    <tspan x="695" dy="0">build-back</tspan>
    <tspan class="small" x="695" dy="25">./gradlew build</tspan>
    <tspan class="small" x="695" dy="22">tests JUnit relancés</tspan>
    <tspan class="small" x="695" dy="22">JAR Spring Boot</tspan>
  </text>

  <path class="arrow-blue" d="M 520 805 L 520 825 L 345 825 L 345 900"/>
  <path class="arrow-blue" d="M 520 805 L 520 825 L 695 825 L 695 900"/>

  <polygon class="gate" points="520,1105 585,1155 520,1205 455,1155"/>
  <text class="label small" x="520" y="1147">
    <tspan x="520" dy="0">Condition</tspan>
    <tspan x="520" dy="19">2 builds réussis</tspan>
  </text>
  <path class="arrow-blue" d="M 345 1030 L 345 1090 L 455 1155"/>
  <path class="arrow-blue" d="M 695 1030 L 695 1090 L 585 1155"/>

  <rect class="observed" x="345" y="1235" width="350" height="75"/>
  <text class="label" x="520" y="1264">
    <tspan x="520" dy="0">Fin du pipeline</tspan>
    <tspan class="small" x="520" dy="23">sorties de jobs non publiées</tspan>
  </text>
  <path class="arrow-blue" d="M 520 1205 L 520 1235"/>

  <rect class="gap" x="95" y="1350" width="270" height="65"/>
  <text class="label-red small" x="230" y="1375">
    <tspan x="230" dy="0">Aucun rapport ni artefact</tspan>
    <tspan x="230" dy="20">configuré dans la CI</tspan>
  </text>

  <rect class="gap" x="385" y="1350" width="240" height="65"/>
  <text class="label-red small" x="505" y="1375">
    <tspan x="505" dy="0">Aucune image publiée</tspan>
    <tspan x="505" dy="20">par la CI</tspan>
  </text>

  <rect class="gap" x="645" y="1350" width="300" height="65"/>
  <text class="label-red small" x="795" y="1375">
    <tspan x="795" dy="0">Aucun déploiement automatisé</tspan>
    <tspan x="795" dy="20">dans la CI</tspan>
  </text>

  <path class="arrow-red" d="M 520 1310 L 520 1330 L 230 1330 L 230 1350"/>
  <path class="arrow-red" d="M 365 1382 L 385 1382"/>
  <path class="arrow-red" d="M 625 1382 L 645 1382"/>

  <!-- Flux Docker manuel -->
  <rect class="group" x="1030" y="60" width="520" height="1380"/>
  <text class="group-title" x="1060" y="98">Flux Docker hors CI</text>

  <rect class="reproduced" x="1120" y="245" width="340" height="90"/>
  <text class="label-green" x="1290" y="278">
    <tspan x="1290" dy="0">Build Docker manuel</tspan>
    <tspan class="small" x="1290" dy="25">commandes du README</tspan>
  </text>

  <rect class="reproduced" x="1120" y="390" width="340" height="90"/>
  <text class="label-green" x="1290" y="423">
    <tspan x="1290" dy="0">Images locales</tspan>
    <tspan class="small" x="1290" dy="25">frontend · backend · standalone</tspan>
  </text>

  <rect class="declared" x="1120" y="555" width="340" height="80"/>
  <text class="label-orange" x="1290" y="603">Transmission à l’équipe Ops</text>

  <rect class="declared" x="1120" y="710" width="340" height="80"/>
  <text class="label-orange" x="1290" y="758">Scan Trivy manuel</text>

  <rect class="declared" x="1120" y="865" width="340" height="100"/>
  <text class="label-orange" x="1290" y="903">
    <tspan x="1290" dy="0">Déploiement manuel</tspan>
    <tspan class="small" x="1290" dy="25">cible non décrite dans le dépôt</tspan>
  </text>

  <path class="arrow-green" d="M 675 160 L 1010 160 L 1010 290 L 1120 290"/>
  <text class="edge-label" x="810" y="148">documenté et reproduit</text>
  <path class="arrow-green" d="M 1290 335 L 1290 390"/>
  <path class="arrow-orange" d="M 1290 480 L 1290 555"/>
  <text class="edge-label" x="1310" y="525">déclaré par les Ops</text>
  <path class="arrow-orange" d="M 1290 635 L 1290 710"/>
  <text class="edge-label" x="1310" y="680">déclaré</text>
  <path class="arrow-orange" d="M 1290 790 L 1290 865"/>
  <text class="edge-label" x="1310" y="835">déclaré</text>

  <!-- Légende -->
  <text class="group-title" x="1080" y="1060">Légende</text>
  <rect class="observed" x="1080" y="1095" width="42" height="30"/>
  <text class="legend" x="1140" y="1117">Observé dans le dépôt ou reproduit par l’audit</text>

  <rect class="reproduced" x="1080" y="1150" width="42" height="30"/>
  <text class="legend" x="1140" y="1172">Commandes documentées et reproduites localement</text>

  <rect class="declared" x="1080" y="1205" width="42" height="30"/>
  <text class="legend" x="1140" y="1227">Pratique déclarée par les Ops</text>

  <rect class="gap" x="1080" y="1260" width="42" height="30"/>
  <text class="legend" x="1140" y="1282">Fonction absente de la CI actuelle</text>

  <text class="legend" x="1080" y="1345">
    <tspan x="1080" dy="0">État audité : branche dev</tspan>
    <tspan x="1080" dy="22">commit 526bd96cddd2903676988b56dfeb2778667aa435</tspan>
  </text>
</svg>
