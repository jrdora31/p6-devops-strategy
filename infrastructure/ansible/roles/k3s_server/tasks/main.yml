---
- name: Créer le dossier de configuration K3s
  ansible.builtin.file:
    path: "{{ k3s_server_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Déployer la configuration K3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_server_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Redémarrer K3s

- name: Lire la version K3s installée
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_server_installed_version
  check_mode: false
  changed_when: false
  failed_when: false

- name: Télécharger le script d'installation officiel K3s
  ansible.builtin.get_url:
    url: "{{ k3s_server_install_script_url }}"
    dest: /usr/local/src/k3s-install.sh
    owner: root
    group: root
    mode: "0755"
  when: >-
    k3s_server_version not in
    (k3s_server_installed_version.stdout | default(''))

- name: Installer la version K3s attendue
  ansible.builtin.command:
    cmd: /usr/local/src/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_server_version }}"
    INSTALL_K3S_EXEC: "server --config {{ k3s_server_config_path }}"
  when: >-
    k3s_server_version not in
    (k3s_server_installed_version.stdout | default(''))
  changed_when: true

- name: Appliquer les handlers avant les contrôles de santé
  ansible.builtin.meta: flush_handlers

- name: Garantir que K3s est démarré au boot
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
  when: >-
    not ansible_check_mode or
    k3s_server_version in
    (k3s_server_installed_version.stdout | default(''))

- name: Attendre l'API Kubernetes locale
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 180
  when: >-
    not ansible_check_mode or
    k3s_server_version in
    (k3s_server_installed_version.stdout | default(''))

- name: Lire le jeton d'adhésion des agents K3s
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_node_token
  no_log: true
  when: not ansible_check_mode

- name: Stabiliser K3s avant de configurer le GitLab Agent
  when: not ansible_check_mode
  tags:
    - k3s_runtime_readiness
  block:
    - name: Attendre que l'API Kubernetes soit réellement prête
      block:
        - name: Interroger le point de contrôle Kubernetes readyz
          ansible.builtin.command:
            cmd: /usr/local/bin/k3s kubectl get --raw=/readyz
          register: k3s_server_api_initial_ready
          changed_when: false
          retries: "{{ k3s_server_api_ready_retries }}"
          delay: "{{ k3s_server_api_ready_delay }}"
          until: >-
            k3s_server_api_initial_ready.rc == 0 and
            'ok' in k3s_server_api_initial_ready.stdout
      rescue:
        - name: Redémarrer K3s une seule fois après une API durablement indisponible
          ansible.builtin.systemd_service:
            name: k3s
            state: restarted
            daemon_reload: true

        - name: Attendre le retour du port Kubernetes après récupération
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 6443
            timeout: 180

        - name: Attendre readyz après la récupération K3s
          ansible.builtin.command:
            cmd: /usr/local/bin/k3s kubectl get --raw=/readyz
          register: k3s_server_api_recovered
          changed_when: false
          retries: "{{ k3s_server_api_ready_retries }}"
          delay: "{{ k3s_server_api_ready_delay }}"
          until: >-
            k3s_server_api_recovered.rc == 0 and
            'ok' in k3s_server_api_recovered.stdout

    - name: Vérifier que le serveur Kubernetes est prêt
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - wait
          - --for=condition=Ready
          - "node/{{ ansible_hostname }}"
          - "--timeout={{ k3s_server_node_ready_timeout }}"
      register: k3s_server_node_check
      changed_when: false
      retries: "{{ k3s_server_node_ready_retries }}"
      delay: 10
      until: k3s_server_node_check.rc == 0
  rescue:
    - name: Relever l'état du service K3s après échec
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - k3s
          - --property=ActiveState
          - --property=SubState
          - --property=Result
          - --property=NRestarts
      register: k3s_server_service_diagnostic
      changed_when: false
      failed_when: false

    - name: Relever le détail du contrôle readyz après échec
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get --raw=/readyz?verbose
      register: k3s_server_readyz_diagnostic
      changed_when: false
      failed_when: false

    - name: Relever la mémoire disponible après échec
      ansible.builtin.command:
        argv:
          - free
          - --mebi
      register: k3s_server_memory_diagnostic
      changed_when: false
      failed_when: false

    - name: Relever l'espace disque disponible après échec
      ansible.builtin.command:
        argv:
          - df
          - --human-readable
          - /
          - /var/lib/rancher/k3s
      register: k3s_server_disk_diagnostic
      changed_when: false
      failed_when: false

    - name: Relever les derniers journaux K3s après échec
      ansible.builtin.command:
        argv:
          - journalctl
          - --unit=k3s
          - --lines=100
          - --no-pager
          - --output=cat
      register: k3s_server_journal_diagnostic
      changed_when: false
      failed_when: false

    - name: Afficher le diagnostic K3s expurgé
      ansible.builtin.debug:
        msg:
          service: "{{ k3s_server_service_diagnostic.stdout_lines | default([]) }}"
          readyz: >-
            {{ (k3s_server_readyz_diagnostic.stdout_lines | default([])) +
               (k3s_server_readyz_diagnostic.stderr_lines | default([])) }}
          memory: "{{ k3s_server_memory_diagnostic.stdout_lines | default([]) }}"
          disk: "{{ k3s_server_disk_diagnostic.stdout_lines | default([]) }}"
          journal: "{{ k3s_server_journal_diagnostic.stdout_lines | default([]) }}"

    - name: Arrêter le rôle lorsque K3s reste indisponible
      ansible.builtin.fail:
        msg: >-
          K3s n'est pas devenu opérationnel après l'attente initiale et une
          tentative unique de redémarrage. Consulter le diagnostic précédent ;
          ne pas poursuivre le déploiement du GitLab Agent.

- name: Garantir le dossier des manifestes auto-déployés K3s
  ansible.builtin.file:
    path: "{{ k3s_server_gitlab_agent_manifest_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Garantir le namespace du GitLab Agent
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl apply --filename -
    stdin: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ k3s_server_gitlab_agent_namespace }}
        labels:
          app.kubernetes.io/managed-by: ansible
  register: k3s_server_gitlab_agent_namespace_apply
  changed_when: >-
    'created' in k3s_server_gitlab_agent_namespace_apply.stdout or
    'configured' in k3s_server_gitlab_agent_namespace_apply.stdout
  when: not ansible_check_mode

- name: Attendre que le namespace du GitLab Agent soit actif
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - wait
      - "--for=jsonpath={.status.phase}=Active"
      - "namespace/{{ k3s_server_gitlab_agent_namespace }}"
      - --timeout=60s
  changed_when: false
  when: not ansible_check_mode

- name: Vérifier l'état réel de l'API Kubernetes avant le Secret
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: k3s_server_api_ready
  changed_when: false
  retries: 6
  delay: 5
  until: >-
    k3s_server_api_ready.rc == 0 and
    'ok' in k3s_server_api_ready.stdout
  when: not ansible_check_mode

- name: Installer le Secret du GitLab Agent sans l'écrire durablement sur l'hôte
  when: not ansible_check_mode
  no_log: true
  block:
    - name: Préparer temporairement le Secret du GitLab Agent
      ansible.builtin.template:
        src: gitlab-agent-secret.yaml.j2
        dest: /run/microcrm-gitlab-agent-secret.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Appliquer le Secret du GitLab Agent
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/k3s kubectl apply
          --filename /run/microcrm-gitlab-agent-secret.yaml
      register: k3s_server_gitlab_agent_secret_apply
      changed_when: >-
        'created' in k3s_server_gitlab_agent_secret_apply.stdout or
        'configured' in k3s_server_gitlab_agent_secret_apply.stdout
      retries: 3
      delay: 5
      until: k3s_server_gitlab_agent_secret_apply.rc == 0
  always:
    - name: Retirer le manifeste temporaire contenant le jeton
      ansible.builtin.file:
        path: /run/microcrm-gitlab-agent-secret.yaml
        state: absent

- name: Déclarer le chart GitLab Agent au Helm Controller K3s
  ansible.builtin.template:
    src: gitlab-agent-helmchart.yaml.j2
    dest: "{{ k3s_server_gitlab_agent_manifest_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Attendre que le GitLab Agent soit prêt
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/k3s kubectl wait
      --namespace {{ k3s_server_gitlab_agent_namespace }}
      --for=condition=Ready pod
      --selector=app.kubernetes.io/instance={{ k3s_server_gitlab_agent_release_name }}
      --timeout=60s
  register: k3s_server_gitlab_agent_ready
  changed_when: false
  retries: 6
  delay: 10
  until: k3s_server_gitlab_agent_ready.rc == 0
  when: not ansible_check_mode
