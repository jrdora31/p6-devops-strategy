---
- name: Vérifier le système attendu par le rôle
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '12'
      - ansible_facts.architecture == 'x86_64'
    fail_msg: "Le POC attend Debian 12 amd64 ; aucun autre système n'est configuré automatiquement."

- name: Installer les prérequis communs
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
    state: present
    update_cache: true
    cache_valid_time: 3600
