---
- name: Vérifier le ciblage de l'environnement K3s
  hosts: localhost
  gather_facts: false
  vars:
    deployment_environment: "{{ lookup('ansible.builtin.env', 'DEPLOYMENT_ENVIRONMENT') }}"
  tasks:
    - name: Garantir un environnement autorisé et une seule EC2 cible
      ansible.builtin.assert:
        that:
          - deployment_environment in ['staging', 'production']
          - groups.get('k3s_servers', []) | length == 1
        fail_msg: >-
          L'inventaire doit contenir exactement une EC2 K3s pour
          DEPLOYMENT_ENVIRONMENT=staging ou production.

- name: Configurer le serveur K3s MicroCRM de l'environnement sélectionné
  hosts: k3s_servers
  gather_facts: false
  become: true
  vars:
    ansible_connection: amazon.aws.aws_ssm
    ansible_aws_ssm_bucket_name: >-
      {{ lookup('ansible.builtin.env', 'ANSIBLE_AWS_SSM_BUCKET_NAME') }}
    ansible_aws_ssm_region: >-
      {{ lookup('ansible.builtin.env', 'AWS_REGION') | default('eu-west-3', true) }}
    cloudwatch_agent_enabled: >-
      {{ lookup('ansible.builtin.env', 'CLOUDWATCH_AGENT_ENABLED')
         | default('false', true) | bool }}
    deployment_environment: >-
      {{ lookup('ansible.builtin.env', 'DEPLOYMENT_ENVIRONMENT') }}

  pre_tasks:
    - name: Vérifier le tag de l'EC2 ciblée
      ansible.builtin.assert:
        that:
          - ec2_tags.Environment == deployment_environment
        fail_msg: >-
          L'EC2 ciblée par Ansible n'appartient pas à l'environnement demandé.

    - name: Vérifier la variable du bucket temporaire SSM
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'ANSIBLE_AWS_SSM_BUCKET_NAME') | length > 0
        fail_msg: >-
          ANSIBLE_AWS_SSM_BUCKET_NAME doit contenir l'output Terraform
          ansible_transfer_bucket.

    - name: Vérifier le jeton du GitLab Agent
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'GITLAB_AGENT_TOKEN') | length > 0
        fail_msg: >-
          GITLAB_AGENT_TOKEN doit être défini comme variable GitLab protégée
          et masquée avant l'exécution du playbook.
      when: not ansible_check_mode

    - name: Attendre que Systems Manager accepte la connexion
      ansible.builtin.wait_for_connection:
        timeout: 300
      check_mode: false

    - name: Collecter les informations du serveur après connexion
      ansible.builtin.setup:

  roles:
    - role: common
    - role: k3s_server
    - role: cloudwatch_agent
