---
# Ce fichier reste sous inventory/group_vars afin que l'inventaire dynamique
# charge effectivement ces variables pour le groupe k3s_servers.
# La connexion passe par Systems Manager : aucun port SSH ni fichier de clé
# privée n'est nécessaire sur le runner GitLab ou le poste d'administration.
ansible_connection: amazon.aws.aws_ssm
ansible_aws_ssm_region: "{{ lookup('ansible.builtin.env', 'AWS_REGION') | default('eu-west-3', true) }}"
ansible_aws_ssm_bucket_name: "{{ lookup('ansible.builtin.env', 'ANSIBLE_AWS_SSM_BUCKET_NAME') }}"
ansible_aws_ssm_s3_addressing_style: virtual
ansible_aws_ssm_timeout: 120
ansible_become: true

# Chaque exécution cible exactement l'environnement transmis par le state
# Terraform et filtré par l'inventaire dynamique AWS.
deployment_environment: "{{ lookup('ansible.builtin.env', 'DEPLOYMENT_ENVIRONMENT') }}"
k3s_server_gitlab_agent_name: >-
  {{ 'microcrm-poc' if deployment_environment == 'staging'
     else 'microcrm-production' }}

# O.4 : le même interrupteur CI pilote Terraform et Ansible dans le seul
# environnement sélectionné. La valeur par défaut reste désactivée.
cloudwatch_agent_enabled: "{{ lookup('ansible.builtin.env', 'CLOUDWATCH_AGENT_ENABLED') | default('false', true) | bool }}"
cloudwatch_agent_log_group_prefix: >-
  {{ lookup('ansible.builtin.env', 'CLOUDWATCH_LOG_GROUP_PREFIX')
     | default('/microcrm/' ~ deployment_environment, true) }}
cloudwatch_agent_metrics_namespace: >-
  {{ lookup('ansible.builtin.env', 'CLOUDWATCH_METRICS_NAMESPACE')
     | default('MicroCRM/' ~ (deployment_environment | title), true) }}
cloudwatch_agent_collect_kubernetes_logs: true
