# Le backend n'accepte que les appels provenant du frontend de la même release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microcrm.fullname" . }}-backend
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
spec:
  # podSelector désigne les Pods protégés; from désigne les seuls appelants admis.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "microcrm.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "microcrm.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8080
---
# PostgreSQL reste accessible aux backends stable et, lorsqu'il est actif,
# Canary; aucun autre composant du namespace n'est autorisé par cette policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microcrm.fullname" . }}-database
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
spec:
  # La base accepte le backend stable et ajoute le backend Canary uniquement
  # pendant l'expérimentation.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "microcrm.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: database
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "microcrm.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: backend
        {{- if .Values.canary.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "microcrm.name" . }}
              app.kubernetes.io/instance: {{ printf "%s-canary" .Release.Name }}
              app.kubernetes.io/component: backend
              microcrm.io/track: canary
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
