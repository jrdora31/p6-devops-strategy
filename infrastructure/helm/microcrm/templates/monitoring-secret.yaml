{{/* Le Secret géré est optionnel; la CI préfère référencer des credentials
créés hors du rendu applicatif. */}}
{{- if .Values.monitoringAuth.managedSecret.enabled }}
# Les champs sont encodés dans data; le mot de passe reste obligatoire.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.monitoringAuth.existingSecret }}
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.monitoringAuth.usernameKey }}: {{ required "monitoringAuth.managedSecret.username est obligatoire" .Values.monitoringAuth.managedSecret.username | b64enc | quote }}
  {{ .Values.monitoringAuth.passwordKey }}: {{ required "monitoringAuth.managedSecret.passwordBase64 est obligatoire" .Values.monitoringAuth.managedSecret.passwordBase64 | quote }}
{{- end }}
