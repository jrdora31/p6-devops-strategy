{{/* En mode Canary, Traefik répartit le trafic entre deux Services.
La validation refuse une route dont les poids ne représentent pas 100 %. */}}
{{- if and .Values.ingress.enabled .Values.canary.enabled }}
{{- if ne (add (int .Values.canary.stableWeight) (int .Values.canary.canaryWeight)) 100 }}
{{- fail "la somme de canary.stableWeight et canary.canaryWeight doit être égale à 100" }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ include "microcrm.fullname" . }}-frontend-weighted
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
spec:
  weighted:
    # Chaque poids nul retire le Service correspondant du rendu Traefik.
    services:
      {{- if gt (int .Values.canary.stableWeight) 0 }}
      - name: {{ include "microcrm.fullname" . }}-frontend
        kind: Service
        port: http
        weight: {{ .Values.canary.stableWeight }}
      {{- end }}
      {{- if gt (int .Values.canary.canaryWeight) 0 }}
      - name: {{ include "microcrm.fullname" . }}-canary-frontend
        kind: Service
        port: http
        weight: {{ .Values.canary.canaryWeight }}
      {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "microcrm.fullname" . }}
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  # La règle Host choisit cette release; le TraefikService choisit ensuite le track.
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" .Values.ingress.host | quote }}
      services:
        - name: {{ include "microcrm.fullname" . }}-frontend-weighted
          kind: TraefikService
{{- else if .Values.ingress.enabled }}
# Sans Canary, un Ingress Kubernetes standard envoie tout le trafic vers le
# Service frontend stable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "microcrm.fullname" . }}
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # Le fallback stable pointe directement sur le Service frontend standard.
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "microcrm.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
