apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microcrm.fullname" . }}-backend
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- include "microcrm.releaseLabels" (dict "track" "stable" "version" .Values.release.version) | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "microcrm.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "microcrm.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
        {{- include "microcrm.releaseLabels" (dict "track" "stable" "version" .Values.release.version) | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.backend.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.backend.podAntiAffinity.weight }}
              podAffinityTerm:
                topologyKey: {{ .Values.backend.podAntiAffinity.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "microcrm.name" . }}
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: backend
      {{- end }}
      containers:
        - name: backend
          image: {{ include "microcrm.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: {{ include "microcrm.fullname" . }}-backend
          env:
            - name: MICROCRM_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.release.environment | quote }}
            - name: MICROCRM_DEPLOYMENT_TRACK
              value: stable
            - name: MICROCRM_RELEASE_VERSION
              value: {{ .Values.release.version | quote }}
            - name: MICROCRM_STATSD_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: MICROCRM_MONITORING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "monitoringAuth.existingSecret est obligatoire" .Values.monitoringAuth.existingSecret }}
                  key: {{ .Values.monitoringAuth.usernameKey }}
                  optional: true
            - name: MICROCRM_MONITORING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "monitoringAuth.existingSecret est obligatoire" .Values.monitoringAuth.existingSecret }}
                  key: {{ .Values.monitoringAuth.passwordKey }}
                  optional: true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret est obligatoire" .Values.database.existingSecret }}
                  key: {{ .Values.database.usernameKey }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret est obligatoire" .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
