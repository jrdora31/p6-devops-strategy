# Environnement d'intégration déployé dans le cluster K3s partagé.
# Le namespace est fourni par le job GitLab ; l'hôte reste un domaine de
# documentation tant qu'aucun DNS réel n'est configuré.
fullnameOverride: microcrm-staging

release:
  environment: staging

# Force la release d'intégration sur le nœud serveur labellisé staging.
nodeSelector:
  microcrm.io/environment-role: staging

database:
  persistence:
    size: 2Gi
    storageClass: local-path

# L'hôte documentaire permet à Traefik de distinguer cette release.
ingress:
  enabled: true
  className: traefik
  host: microcrm-staging.example.invalid
