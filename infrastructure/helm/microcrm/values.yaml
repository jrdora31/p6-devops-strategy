# Valeurs communes à tous les environnements. Les fichiers values-*.yaml ne
# remplacent que le placement, le stockage et l'exposition propres au contexte.
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Identifie l'environnement et la version dans les labels et métriques runtime.
release:
  environment: development
  version: unreleased

# Les fichiers d'environnement renseignent ce sélecteur pour imposer le nœud cible.
nodeSelector: {}

# Désactivé en CI lorsque le Secret de registre est créé avant helm upgrade.
registrySecret:
  enabled: false
  name: microcrm-registry
  server: ""
  usernameBase64: ""
  passwordBase64: ""

# Le frontend et le backend partagent le modèle réplicas, anti-affinité,
# référence d'image, port de Service et ressources garanties/plafonnées.
frontend:
  replicaCount: 2
  podAntiAffinity:
    enabled: true
    weight: 100
    topologyKey: kubernetes.io/hostname
  image:
    repository: registry.gitlab.com/project_6_group/microcrm/frontend
    tag: replace-me
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

backend:
  replicaCount: 2
  podAntiAffinity:
    enabled: true
    weight: 100
    topologyKey: kubernetes.io/hostname
  image:
    repository: registry.gitlab.com/project_6_group/microcrm/backend
    tag: replace-me
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Les clés indiquent au Deployment où lire les credentials dans le Secret existant.
monitoringAuth:
  existingSecret: microcrm-monitoring
  usernameKey: username
  passwordKey: password
  managedSecret:
    enabled: false
    username: monitoring
    passwordBase64: ""

# Le Canary est inactif par défaut; la CI fournit sa version, ses digests et
# les poids de trafic au moment du déploiement contrôlé.
canary:
  enabled: false
  stableWeight: 100
  canaryWeight: 0
  version: ""
  frontend:
    replicaCount: 1
    image:
      repository: registry.gitlab.com/project_6_group/microcrm/frontend
      tag: replace-me
      digest: ""
      pullPolicy: IfNotPresent
  backend:
    replicaCount: 1
    image:
      repository: registry.gitlab.com/project_6_group/microcrm/backend
      tag: replace-me
      digest: ""
      pullPolicy: IfNotPresent

# Les identifiants réels proviennent d'un Secret existant. La création d'un
# Secret par le chart reste réservée aux environnements qui l'activent.
database:
  image:
    repository: postgres
    tag: 17.10-alpine3.23
    digest: ""
    pullPolicy: IfNotPresent
  name: microcrm
  existingSecret: microcrm-database
  usernameKey: username
  passwordKey: password
  managedSecret:
    enabled: false
    username: microcrm
    passwordBase64: ""
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# L'exposition est désactivée par défaut et activée par le fichier d'environnement.
ingress:
  enabled: false
  className: ""
  host: microcrm.local
  annotations: {}
  tls: []
