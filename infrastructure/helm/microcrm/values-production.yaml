# Environnement de production du POC, promu manuellement par un tag SemVer.
# Il est déployé dans un namespace dédié du cluster K3s partagé.
fullnameOverride: microcrm-prod

release:
  environment: production

# Force tous les workloads de la release sur le nœud labellisé production.
nodeSelector:
  microcrm.io/environment-role: production

database:
  persistence:
    size: 2Gi
    storageClass: local-path

ingress:
  enabled: true
  className: traefik
  host: microcrm.example.invalid

# Les poids sont utilisés uniquement lorsque la CI active le mode Canary.
canary:
  stableWeight: 90
  canaryWeight: 10
