# Environnement de production du POC, promu manuellement par un tag SemVer.
# Il est déployé dans un namespace dédié du cluster K3s partagé.
fullnameOverride: microcrm-prod

release:
  environment: production

nodeSelector:
  microcrm.io/environment-role: production

database:
  persistence:
    size: 2Gi
    storageClass: local-path

ingress:
  enabled: true
  className: traefik
  host: microcrm.example.invalid

canary:
  stableWeight: 90
  canaryWeight: 10
